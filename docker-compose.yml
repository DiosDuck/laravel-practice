services:
  postgres:
    image: postgres:17-alpine
    container_name: laravel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_first_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - ./local/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d app_first_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app_first:
    build: ./docker/app_first
    container_name: laravel_app_first
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: app_first_db
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    ports:
      - "2000:80"
    volumes:
      - ./app_first:/var/www/html:rw
    depends_on:
      postgres:
        condition: service_healthy
